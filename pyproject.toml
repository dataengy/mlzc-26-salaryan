[project]
name = "mlzc-26-salaryan"
version = "0.1.0"
description = "Reproducible AI and data job salary prediction project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.2.3",
    "scikit-learn==1.8.0",
    "joblib==1.5.3",
    "fastapi==0.128.2",
    "uvicorn==0.48.0",
    "pydantic==2.12.5",
    "matplotlib==3.10.8",
    "pytest==9.0.2",
    "httpx==0.28.1",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
notebook = ["ipykernel>=7.4.0", "notebook>=7.5.1"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
